query Health {
  health
}

query Viewer {
  viewer {
    id
    displayName
    email
    accountRole
  }
}

query ProjectSummaries($page: Int!, $pageSize: Int!, $search: String) {
  projectSummaries(page: $page, pageSize: $pageSize, search: $search) {
    page
    pageSize
    total
    totalPages
    hasNextPage
    hasPreviousPage
    items {
      id
      name
      targetCurrency
      agreedRateFirst
      status
      inviteCode
      inviteLink
      memberCount
      viewerRole
      createdAt
      updatedAt
    }
  }
}

query ProjectDetail($projectId: ID!) {
  project(id: $projectId) {
    id
    name
    targetCurrency
    status
  }
}

query ProjectParticipants(
  $projectId: ID!
  $page: Int! = 1
  $pageSize: Int! = 100
) {
  participants(projectId: $projectId, page: $page, pageSize: $pageSize) {
    id
    projectId
    name
    createdAt
  }
}

query ProjectExpenses(
  $projectId: ID!
  $page: Int! = 1
  $pageSize: Int! = 200
  $includeDeleted: Boolean = false
) {
  expenses(
    projectId: $projectId
    page: $page
    pageSize: $pageSize
    includeDeleted: $includeDeleted
  ) {
    id
    projectId
    payerId
    payer {
      id
      name
    }
    amount
    currency
    description
    createdAt
    updatedAt
  }
}

query DebitCreditSummary($projectId: ID!, $includeDeleted: Boolean = false) {
  debitCreditSummary(projectId: $projectId, includeDeleted: $includeDeleted) {
    projectId
    currency
    generatedAt
    totalDebitCount
    totalCreditCount
    rows {
      participantId
      participant {
        id
        name
      }
      debitAmount
      creditAmount
      debitCount
      creditCount
      netAmount
    }
  }
}

mutation CreateProject(
  $name: String!
  $targetCurrency: String
  $agreedRateFirst: Boolean
) {
  createProject(
    name: $name
    targetCurrency: $targetCurrency
    agreedRateFirst: $agreedRateFirst
  ) {
    id
    name
    targetCurrency
    agreedRateFirst
    status
    inviteCode
    inviteLink
    memberCount
    createdAt
    updatedAt
  }
}

mutation CreateExpense(
  $projectId: ID!
  $payerId: ID!
  $amount: Float!
  $currency: Currency!
  $description: String
) {
  createExpense(
    projectId: $projectId
    payerId: $payerId
    amount: $amount
    currency: $currency
    description: $description
  ) {
    id
    projectId
    payerId
    payer {
      id
      name
    }
    amount
    currency
    description
    createdAt
    updatedAt
  }
}

mutation UpdateProject(
  $projectId: ID!
  $name: String
  $targetCurrency: String
  $agreedRateFirst: Boolean
) {
  updateProject(
    projectId: $projectId
    name: $name
    targetCurrency: $targetCurrency
    agreedRateFirst: $agreedRateFirst
  ) {
    id
    name
    targetCurrency
    agreedRateFirst
    status
    inviteCode
    inviteLink
    memberCount
    createdAt
    updatedAt
  }
}

mutation JoinProject($inviteCode: String!) {
  joinProject(inviteCode: $inviteCode) {
    id
  }
}

mutation ArchiveProject($projectId: ID!) {
  archiveProject(projectId: $projectId) {
    id
    status
  }
}

mutation DeleteProject($projectId: ID!) {
  deleteProject(projectId: $projectId)
}

mutation LeaveProject($projectId: ID!) {
  leaveProject(projectId: $projectId)
}
