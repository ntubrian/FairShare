mutation CreateProject(
  $name: String!
  $targetCurrency: String
  $agreedRateFirst: Boolean
) {
  createProject(
    name: $name
    targetCurrency: $targetCurrency
    agreedRateFirst: $agreedRateFirst
  ) {
    id
    name
    targetCurrency
    agreedRateFirst
    status
    inviteCode
    inviteLink
    memberCount
    createdAt
    updatedAt
  }
}

mutation CreateExpense(
  $projectId: ID!
  $payerId: ID!
  $amount: Float!
  $currency: Currency!
  $description: String
  $occurredAt: String
  $splitMode: SplitMode
  $splits: [ExpenseSplitInput!]
) {
  createExpense(
    projectId: $projectId
    payerId: $payerId
    amount: $amount
    currency: $currency
    description: $description
    occurredAt: $occurredAt
    splitMode: $splitMode
    splits: $splits
  ) {
    id
    projectId
    payerId
    payer {
      id
      name
    }
    amount
    currency
    splitMode
    description
    occurredAt
    createdAt
    updatedAt
    deletedAt
    splits {
      participantId
      amount
      shares
      participant {
        id
        name
      }
    }
  }
}

