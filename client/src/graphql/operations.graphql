query Health {
  health
}

query Viewer {
  viewer {
    id
    displayName
    email
    accountRole
  }
}

query ProjectSummaries($page: Int!, $pageSize: Int!, $search: String) {
  projectSummaries(page: $page, pageSize: $pageSize, search: $search) {
    page
    pageSize
    total
    totalPages
    hasNextPage
    hasPreviousPage
    items {
      id
      name
      targetCurrency
      agreedRateFirst
      status
      inviteCode
      inviteLink
      memberCount
      viewerRole
      createdAt
      updatedAt
    }
  }
}

query ProjectDetail($projectId: ID!) {
  project(id: $projectId) {
    id
    name
    targetCurrency
    agreedRateFirst
    status
    members {
      userId
      role
      user {
        id
        displayName
        email
        accountRole
      }
    }
  }
}

query ProjectParticipants(
  $projectId: ID!
  $page: Int! = 1
  $pageSize: Int! = 100
) {
  participants(projectId: $projectId, page: $page, pageSize: $pageSize) {
    id
    projectId
    userId
    name
    createdAt
  }
}

query ProjectExpenses(
  $projectId: ID!
  $page: Int! = 1
  $pageSize: Int! = 200
  $includeDeleted: Boolean = false
) {
  expenses(
    projectId: $projectId
    page: $page
    pageSize: $pageSize
    includeDeleted: $includeDeleted
  ) {
    id
    projectId
    payerId
    payer {
      id
      name
    }
    amount
    currency
    splitMode
    description
    occurredAt
    createdAt
    updatedAt
    deletedAt
    splits {
      participantId
      amount
      shares
      participant {
        id
        name
      }
    }
  }
}

query DebitCreditSummary($projectId: ID!, $includeDeleted: Boolean = false) {
  debitCreditSummary(projectId: $projectId, includeDeleted: $includeDeleted) {
    projectId
    currency
    generatedAt
    totalDebitCount
    totalCreditCount
    rows {
      participantId
      participant {
        id
        name
      }
      debitAmount
      creditAmount
      debitCount
      creditCount
      netAmount
    }
  }
}

query CalculateSettlement($projectId: ID!, $includeDeleted: Boolean = false) {
  calculateSettlement(projectId: $projectId, includeDeleted: $includeDeleted) {
    projectId
    targetCurrency
    generatedAt
    rateSource
    instructions {
      fromParticipantId
      toParticipantId
      amount
      currency
      fromParticipant {
        id
        name
      }
      toParticipant {
        id
        name
      }
    }
    rateSnapshot {
      baseCurrency
      source
      fetchedAt
      rates {
        currency
        rate
      }
    }
  }
}

query PdfExportPreview($projectId: ID!, $includeSoftDeleted: Boolean = false) {
  pdfExportPreview(
    projectId: $projectId
    includeSoftDeleted: $includeSoftDeleted
  ) {
    projectName
    exportTime
    targetCurrency
    rateSnapshotIncluded
    settlementIncluded
    expenseDetailsIncluded
    includeSoftDeleted
    instructionCount
    expenseCount
  }
}

subscription ExpenseAdded($projectId: ID!) {
  expenseAdded(projectId: $projectId) {
