<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#2e7d6b" />
    <title>FairShare Offline</title>
    <style>
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        font-family: "Inter", "Noto Sans TC", system-ui, -apple-system,
          sans-serif;
        background: #fffdf8;
        color: #1f2937;
      }
      .card {
        width: min(460px, calc(100vw - 32px));
        border: 1px solid #ece7da;
        border-radius: 18px;
        background: #ffffff;
        padding: 20px;
      }
      h1 {
        margin: 0 0 10px;
        font-size: 22px;
      }
      p {
        margin: 0;
        color: #4b5563;
        line-height: 1.6;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>You're offline</h1>
      <p>
        FairShare can still display cached data. Reconnect to sync with the
        server.
      </p>
    </main>
  </body>
</html>
